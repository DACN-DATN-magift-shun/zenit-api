services:
  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: "rabbitmq"
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - ./Infrastructures/rabbitmq/data:/var/lib/rabbitmq
      - ./Infrastructures/rabbitmq/log:/var/log/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
  
  redis:
    image: "redis:latest"
    container_name: "redis"
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./Infrastructures/redis/data:/var/lib/redis
    